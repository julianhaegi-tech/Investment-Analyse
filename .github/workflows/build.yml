name: Tests & Paket

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest ziglang
      - run: python -m pytest -q
      - run: python tools/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SaxoPortfolio
          path: dist/SaxoPortfolio/
